name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so vulnerabilities disclosed after a change was merged still come to light.
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway containers that exist only for this job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quantova
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: quantova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantova -d quantova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://quantova:ci-only-password@127.0.0.1:5432/quantova_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: API contract is up to date (frontend/openapi.json)
        run: |
          uv run python -m app.openapi_export ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    name: Frontend (format, lint, tests, build, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Type check and build
        run: npm run build

      - name: Generated API types are up to date (src/lib/api/schema.d.ts)
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.1.0

      # Every Python package in uv.lock (app and dev tools), pinned exactly as installed,
      # checked against the Python Packaging Advisory Database and OSV.
      - name: Python packages (pip-audit)
        working-directory: backend
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      # Packages that ship to users' browsers. High and critical advisories fail the build.
      - name: npm packages (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
