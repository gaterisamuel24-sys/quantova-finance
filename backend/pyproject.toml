[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantova-backend"
version = "0.1.0"
description = "Quantova Finance API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL test database and Redis",
]

# ── Ruff: linting + formatting ────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle errors and warnings
    "F",       # pyflakes: undefined names, unused imports
    "I",       # import sorting
    "B",       # bugbear: likely bugs and design problems
    "UP",      # pyupgrade: modern Python syntax
    "S",       # bandit: security issues
    "SIM",     # simplifications
    "N",       # naming conventions
    "RUF",     # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert; fake credentials are intentional in tests
"alembic/versions/**" = ["E501"]       # generated migrations: long SQL/constraint lines are unavoidable

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]  # the local alembic/ folder holds migrations; imports mean the library

# ── mypy: static type checking ────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
# ReportLab ships without type information; our use of it is covered by tests.
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
